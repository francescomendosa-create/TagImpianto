name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepara sito LEGGERO (codice senza PNG mappe)
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          for item in index.html aggiorna.html manifest.webmanifest sw.js deploy-stamp.txt \
                      version.json css js data icons .nojekyll; do
            if [ -e "$item" ]; then
              cp -a "$item" "_site/"
            fi
          done
          mkdir -p _site/assets/maps
          echo "maps-via-cdn" > _site/assets/maps/README.txt
          test -f _site/index.html
          test -f _site/js/app.js
          test -f _site/version.json
          echo "SITE_BYTES=$(du -sb _site | cut -f1)"
          du -sh _site

      - name: Disattiva deploy Pages vecchi (sblocca coda)
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const deps = await github.rest.repos.listDeployments({
              owner, repo, environment: 'github-pages', per_page: 20
            });
            for (const d of deps.data) {
              if (d.sha === context.sha) continue;
              try {
                await github.rest.repos.createDeploymentStatus({
                  owner, repo,
                  deployment_id: d.id,
                  state: 'inactive',
                  description: 'Superseded by newer deploy',
                  environment: 'github-pages',
                  environment_url: 'https://francescomendosa-create.github.io/tagimpianto-app/'
                });
                core.info(`inactive deployment ${d.id} (${d.sha.slice(0,7)})`);
              } catch (e) {
                core.warning(`skip ${d.id}: ${e.message}`);
              }
            }

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Attesa sblocco
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Deploy retry
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Esito
        run: |
          if [ "${{ steps.deployment.outcome }}" = "success" ] || [ "${{ steps.deployment2.outcome }}" = "success" ]; then
            echo OK
          else
            exit 1
          fi
