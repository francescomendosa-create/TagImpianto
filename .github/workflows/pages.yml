name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepara sito LEGGERO (codice senza PNG mappe)
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          for item in index.html aggiorna.html manifest.webmanifest sw.js deploy-stamp.txt \
                      version.json css js data icons .nojekyll; do
            if [ -e "$item" ]; then
              cp -a "$item" "_site/"
            fi
          done
          mkdir -p _site/assets/maps
          echo "maps-via-cdn" > _site/assets/maps/README.txt
          test -f _site/index.html
          test -f _site/js/app.js
          test -f _site/version.json
          echo "SITE_BYTES=$(du -sb _site | cut -f1)"
          du -sh _site

      - name: Chiudi deploy Actions bloccati + passa a branch gh-pages
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            // 1) Chiudi deployment environment "github-pages" rimasti appesi
            const deps = await github.rest.repos.listDeployments({
              owner, repo, environment: 'github-pages', per_page: 30
            });
            for (const d of deps.data) {
              for (const state of ['inactive', 'failure']) {
                try {
                  await github.rest.repos.createDeploymentStatus({
                    owner, repo,
                    deployment_id: d.id,
                    state,
                    description: 'Sblocco coda Pages',
                    environment: 'github-pages',
                    auto_inactive: true
                  });
                } catch (_) { /* già chiuso */ }
              }
              try {
                await github.request(
                  'POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel',
                  { owner, repo, deploymentId: d.sha }
                );
                core.info(`cancel pages deploy ${d.sha.slice(0,7)}`);
              } catch (e) {
                core.info(`cancel ${d.sha.slice(0,7)}: ${e.message}`);
              }
            }
            // 2) Pubblica da branch gh-pages (evita deploy-pages stuck in deployment_queued)
            try {
              await github.request('PUT /repos/{owner}/{repo}/pages', {
                owner, repo,
                build_type: 'legacy',
                source: { branch: 'gh-pages', path: '/' }
              });
              core.info('Pages source -> gh-pages branch');
            } catch (e) {
              try {
                await github.rest.repos.updateInformationAboutPagesSite({
                  owner, repo,
                  build_type: 'legacy',
                  source: { branch: 'gh-pages', path: '/' }
                });
                core.info('Pages source updated via rest');
              } catch (e2) {
                core.warning(`Pages source: ${e2.message}`);
              }
            }

      - name: Pubblica su branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'deploy ${{ github.sha }}'
