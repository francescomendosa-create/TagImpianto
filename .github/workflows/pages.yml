name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepara sito LEGGERO (codice senza PNG mappe)
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          for item in index.html aggiorna.html manifest.webmanifest sw.js deploy-stamp.txt \
                      version.json css js data icons .nojekyll; do
            if [ -e "$item" ]; then
              cp -a "$item" "_site/"
            fi
          done
          mkdir -p _site/assets/maps
          echo "maps-via-cdn" > _site/assets/maps/README.txt
          test -f _site/index.html
          test -f _site/js/app.js
          test -f _site/version.json
          echo "SITE_BYTES=$(du -sb _site | cut -f1)"
          du -sh _site

      - name: Chiudi deploy Pages bloccati (in_progress)
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const deps = await github.rest.repos.listDeployments({
              owner, repo, environment: 'github-pages', per_page: 50
            });
            core.info(`Found ${deps.data.length} deployments`);
            for (const d of deps.data) {
              if (d.sha === context.sha) {
                core.info(`keep current ${d.sha.slice(0,7)}`);
                continue;
              }
              for (const state of ['failure', 'inactive']) {
                try {
                  await github.rest.repos.createDeploymentStatus({
                    owner, repo,
                    deployment_id: d.id,
                    state,
                    description: `Closed stuck deploy (${state})`,
                    environment: 'github-pages',
                    auto_inactive: true
                  });
                  core.info(`${state} -> ${d.id} ${d.sha.slice(0,7)}`);
                } catch (e) {
                  core.warning(`${state} ${d.id}: ${e.message}`);
                }
              }
              try {
                await github.rest.repos.deleteDeployment({ owner, repo, deployment_id: d.id });
                core.info(`deleted deployment ${d.id}`);
              } catch (e) {
                core.warning(`delete ${d.id}: ${e.message}`);
              }
            }

      - name: Pausa rilascio lock
        run: sleep 35

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
