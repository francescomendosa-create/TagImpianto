name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepara sito LEGGERO (codice senza PNG mappe)
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          for item in index.html aggiorna.html manifest.webmanifest sw.js deploy-stamp.txt \
                      version.json css js data icons .nojekyll; do
            if [ -e "$item" ]; then
              cp -a "$item" "_site/"
            fi
          done
          mkdir -p _site/assets/maps
          echo "maps-via-cdn" > _site/assets/maps/README.txt
          test -f _site/index.html
          test -f _site/js/app.js
          test -f _site/version.json
          echo "SITE_BYTES=$(du -sb _site | cut -f1)"
          du -sh _site

      - name: Chiudi deploy Pages bloccati
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const deps = await github.rest.repos.listDeployments({
              owner, repo, environment: 'github-pages', per_page: 40
            });
            for (const d of deps.data) {
              if (d.sha === context.sha) continue;
              for (const state of ['inactive', 'failure']) {
                try {
                  await github.rest.repos.createDeploymentStatus({
                    owner, repo,
                    deployment_id: d.id,
                    state,
                    description: 'Sblocco coda Pages',
                    environment: 'github-pages',
                    auto_inactive: true
                  });
                } catch (_) {}
              }
              try {
                await github.request(
                  'POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel',
                  { owner, repo, deploymentId: d.sha }
                );
                core.info(`cancel ${d.sha.slice(0,7)}`);
              } catch (e) {
                core.info(`cancel ${d.sha.slice(0,7)}: ${e.message}`);
              }
            }

      - name: Mirror su branch gh-pages (backup)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'mirror ${{ github.sha }}'

      # Deploy ufficiale: branch gh-pages (mirror sopra).
      # Evita actions/deploy-pages che resta spesso in coda/lock su questo repo.
      - name: Conferma mirror
        run: |
          test -f _site/version.json
          echo "Pubblicato su branch gh-pages — Pages legge da lì."
          cat _site/version.json
