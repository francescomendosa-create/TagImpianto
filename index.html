<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1419" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Tag Impianto</title>
  <link rel="manifest" href="./manifest.webmanifest?v=1.7.4" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./css/app.css?v=1.7.4" />
  <script>
    /* Gira prima dei moduli: un service worker vecchio puo' servire JS incompatibili e bloccare l'avvio. */
    (function () {
      var KEY = "ti-boot-clean-1.7.4";
      try {
        if (localStorage.getItem(KEY)) return;
        localStorage.setItem(KEY, "1");
      } catch (_) {
        return;
      }
      if (!("serviceWorker" in navigator)) return;
      navigator.serviceWorker.getRegistrations()
        .then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister(); }));
        })
        .then(function () { return window.caches ? caches.keys() : []; })
        .then(function (keys) {
          return Promise.all((keys || []).map(function (k) { return caches.delete(k); }));
        })
        .then(function () {
          location.reload();
        })
        .catch(function () { /* ignore */ });
    })();
    window.addEventListener("load", function () {
      setTimeout(function () {
        var nav = document.getElementById("plantNav");
        var st = document.getElementById("status");
        if (nav && !nav.children.length && st) {
          st.innerHTML = 'Avvio non riuscito. <a href="./aggiorna.html" style="color:#22d3a6;font-weight:700">Tocca qui per ripristinare</a>';
        }
      }, 6000);
    });
  </script>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">TAG <span>IMPIANTO</span> <small id="appVersion" class="app-version" title="Versione app">v1.7.4</small></div>
      <select id="mapSelect" class="map-select visually-hidden" aria-label="Parte di impianto" tabindex="-1"></select>
      <div class="map-title" id="mapTitle" aria-live="polite"></div>
      <div class="top-actions">
        <button type="button" class="btn" id="btnRefresh" title="Scarica l’ultima versione dell’app">Aggiorna</button>
        <button type="button" class="btn" id="btnFit" title="Adatta all’inquadratura">Adatta</button>
        <button type="button" class="btn" id="btnOcr" title="OCR automatico + poi correggi a mano">OCR</button>
        <button type="button" class="btn" id="btnAnnotate" title="Riposiziona il tag evidenziato">Riposiziona</button>
        <button type="button" class="btn" id="btnNotes" title="Nota sul tag">Nota</button>
        <button type="button" class="btn primary" id="btnSync" title="Sync Firestore">Sync</button>
      </div>
    </header>

    <div class="search-bar">
      <div class="search-wrap">
        <input
          id="searchInput"
          type="search"
          enterkeyhint="search"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
          placeholder="Cerca tag… es. P11100A, XV11120, TK-11100B"
        />
        <button type="button" class="clear-btn" id="clearBtn" aria-label="Pulisci">×</button>
      </div>
    </div>

    <div id="suggestions" class="suggestions" role="listbox"></div>

    <main class="stage">
      <aside id="plantNav" class="plant-nav" aria-label="Menu parti impianto"></aside>
      <div class="stage-main">
        <div id="viewport" class="viewport">
          <div id="world" class="world">
            <img id="mapImage" alt="Mappa impianto" />
            <div id="overlay" class="overlay"></div>
          </div>
        </div>

        <div id="status" class="status">Caricamento…</div>
        <div id="cloudBadge" class="status cloud-badge"></div>
      </div>

      <aside id="drawer" class="drawer" aria-hidden="true">
        <h2>Tag / nota</h2>
        <p>Sigla sull’impianto e eventuale nota operativa.</p>
        <label>
          Sigla / etichetta
          <input id="noteTitle" type="text" placeholder="es. P11100A" />
        </label>
        <label>
          Tipo
          <select id="noteKind">
            <option value="pompa">Pompa</option>
            <option value="valvola">Valvola</option>
            <option value="serbatoio">Serbatoio</option>
            <option value="apparecchio">Apparecchio</option>
            <option value="filtro">Filtro</option>
            <option value="strumento">Strumento</option>
            <option value="mixer">Mixer</option>
            <option value="compressor">Compressore</option>
            <option value="altro">Altro</option>
          </select>
        </label>
        <label>
          Nota
          <textarea id="noteBody" placeholder="Appunti, assetto, attenzione…"></textarea>
        </label>
        <div class="row">
          <button type="button" class="btn primary" id="noteSave">Salva</button>
          <button type="button" class="btn" id="noteDelete">Elimina</button>
          <button type="button" class="btn" id="noteClose">Chiudi</button>
        </div>
      </aside>
    </main>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="./js/app.js?v=1.7.4"></script>
</body>
</html>
