<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Aggiorna Tag Impianto</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f1419; color: #e8eef5; padding: 24px; }
    a { color: #22d3a6; font-weight: 700; }
  </style>
</head>
<body>
  <p>Pulizia cache app e mappe salvate sul dispositivo…</p>
  <p id="msg"></p>
  <script>
    (async function () {
      var msg = document.getElementById("msg");
      try {
        try {
          localStorage.removeItem("ti-boot-clean-1.7.3");
          localStorage.removeItem("ti-boot-clean-1.7.4");
        } catch (_) {}
        if ("serviceWorker" in navigator) {
          var regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(function (r) { return r.unregister(); }));
        }
        if (window.caches) {
          var keys = await caches.keys();
          await Promise.all(keys.map(function (k) { return caches.delete(k); }));
        }
        // Cancella anche le PNG in IndexedDB (altrimenti restano le mappe vecchie)
        await new Promise(function (resolve) {
          var req = indexedDB.deleteDatabase("tag-impianto");
          req.onsuccess = req.onerror = req.onblocked = function () { resolve(); };
        });
        msg.textContent = "Ok. Apro l’ultima versione…";
      } catch (e) {
        msg.textContent = "Pulizia parziale, apro comunque…";
      }
      setTimeout(function () {
        location.replace("./index.html?_app=" + Date.now());
      }, 400);
    })();
  </script>
</body>
</html>
