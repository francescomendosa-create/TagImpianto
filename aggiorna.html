<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>Aggiorna Tag Impianto</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f1419; color: #e8eef5; padding: 24px; }
    a { color: #22d3a6; font-weight: 700; }
  </style>
</head>
<body>
  <p>Pulizia cache e passaggio alla versione ufficiale 1.8.3…</p>
  <p id="msg"></p>
  <script>
    (async function () {
      var CANON = "https://francescomendosa-create.github.io/tagimpianto-app/";
      var msg = document.getElementById("msg");
      if (/\/TagImpianto\//i.test(location.href) && !/tagimpianto-app/i.test(location.href)) {
        location.replace(CANON + "aggiorna.html?_app=" + Date.now());
        return;
      }
      try {
        try {
          var keys = Object.keys(localStorage);
          for (var i = 0; i < keys.length; i++) {
            if (/^ti-boot-clean|^ti-img-sync|^ti-sw-reloaded/.test(keys[i])) {
              localStorage.removeItem(keys[i]);
            }
          }
        } catch (_) {}
        if ("serviceWorker" in navigator) {
          var regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(function (r) { return r.unregister(); }));
        }
        if (window.caches) {
          var ckeys = await caches.keys();
          await Promise.all(ckeys.map(function (k) { return caches.delete(k); }));
        }
        await new Promise(function (resolve) {
          var open = indexedDB.open("tag-impianto");
          open.onerror = function () { resolve(); };
          open.onsuccess = function () {
            var db = open.result;
            if (!db.objectStoreNames.contains("images")) {
              db.close();
              resolve();
              return;
            }
            var tx = db.transaction("images", "readwrite");
            tx.objectStore("images").clear();
            tx.oncomplete = function () { db.close(); resolve(); };
            tx.onerror = function () { db.close(); resolve(); };
          };
        });
        msg.textContent = "Ok. Apro Tag Impianto v1.8.3…";
      } catch (e) {
        msg.textContent = "Pulizia parziale, apro comunque…";
      }
      setTimeout(function () {
        location.replace(CANON + "index.html?_app=" + Date.now());
      }, 400);
    })();
  </script>
</body>
</html>
