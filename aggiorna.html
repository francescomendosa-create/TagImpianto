<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>Aggiorna Tag Impianto</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f1419; color: #e8eef5; padding: 24px; }
    a { color: #22d3a6; font-weight: 700; }
  </style>
</head>
<body>
  <p>Pulizia cache e Service Worker…</p>
  <p id="msg"></p>
  <script>
    (async function () {
      var msg = document.getElementById("msg");
      var target = "?";
      try {
        var vr = await fetch("./js/version.js?_=" + Date.now(), { cache: "no-store" });
        var vt = await vr.text();
        var m = /APP_VERSION\s*=\s*"([^"]+)"/.exec(vt);
        if (m) target = m[1];
      } catch (e) {}
      try {
        if ("serviceWorker" in navigator) {
          var regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(function (r) { return r.unregister(); }));
        }
        if (window.caches) {
          var keys = await caches.keys();
          await Promise.all(keys.map(function (k) { return caches.delete(k); }));
        }
        try { localStorage.removeItem("ti-img-sync-" + target); } catch (e) {}
        msg.textContent = "Ok. Apro l’app v" + target + "…";
      } catch (e) {
        msg.textContent = "Pulizia parziale, apro comunque v" + target + "…";
      }
      setTimeout(function () {
        location.replace("./index.html?_ver=" + encodeURIComponent(target) + "&_ts=" + Date.now());
      }, 400);
    })();
  </script>
</body>
</html>
